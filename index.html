                    const isBlobURL = window.location.protocol === 'blob:';
                    const isSandboxed = window.location.hostname.includes('usercontent.goog');
                    if (!isBlobURL && !isSandboxed) {
                        const swCode = `
                            self.addEventListener('install', (e) => { self.skipWaiting(); });
                            self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => new Response("Offline"))); });
                        `;
                        const swBlob = new Blob([swCode], {type: 'application/javascript'});
                        const swUrl = URL.createObjectURL(swBlob);
                        navigator.serviceWorker.register(swUrl).catch(err => {
                            console.log("ServiceWorker registration skipped (expected in preview).");
                        });
                    }
                }

                window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); setDeferredPrompt(e); });
            }, []);

            const boardTiles = [
                { name: "恩典起點", type: "start", color: "bg-yellow-200", img: "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?q=80&w=400" },
                { name: "伊甸園", type: "property", price: 60, rent: 10, color: "bg-emerald-700", text: "white", img: "https://images.unsplash.com/photo-1543857778-c4a1a3e0b2eb?q=80&w=400" },
                { name: "祝福卡", type: "chance", color: "bg-blue-100", img: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400" },
                { name: "亞拉臘山", type: "property", price: 80, rent: 20, color: "bg-emerald-700", text: "white", img: "https://images.unsplash.com/photo-1544198365-f5d60b6d8190?q=80&w=400" },
                { name: "什一奉獻", type: "tax", price: 150, color: "bg-gray-200", img: "https://images.unsplash.com/photo-1534073828943-f801091bb270?q=80&w=400" },
                { name: "吾珥", type: "property", price: 100, rent: 30, color: "bg-sky-500", text: "white", img: "https://images.unsplash.com/photo-1534067783941-51c9c23ecefd?q=80&w=400" },
                { name: "曠野磨練", type: "jail", color: "bg-stone-500", text: "white", img: "https://images.unsplash.com/photo-1473580044384-7ba9967e16a0?q=80&w=400" },
                { name: "別是巴", type: "property", price: 120, rent: 40, color: "bg-sky-500", text: "white", img: "https://images.unsplash.com/photo-1508962914676-134849a727f0?q=80&w=400" },
                { name: "試煉卡", type: "chance", color: "bg-orange-100", img: "https://images.unsplash.com/photo-1439853949127-fa647821eba0?q=80&w=400" },
                { name: "歌珊地", type: "property", price: 140, rent: 50, color: "bg-purple-500", text: "white", img: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=400" },
                { name: "活水泉源", type: "utility", price: 150, rent: 60, color: "bg-cyan-400", img: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=400" },
                { name: "西奈山", type: "property", price: 160, rent: 70, color: "bg-purple-500", text: "white", img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=400" },
                { name: "安息日", type: "parking", color: "bg-green-200", img: "https://images.unsplash.com/photo-1499346030926-9a72daac6c63?q=80&w=400" },
                { name: "耶利哥", type: "property", price: 180, rent: 80, color: "bg-orange-500", text: "white", img: "https://images.unsplash.com/photo-1516108317508-6918c35f0f8b?q=80&w=400" },
                { name: "祝福卡", type: "chance", color: "bg-blue-100", img: "https://images.unsplash.com/photo-1464802686167-b939a67e06d1?q=80&w=400" },
                { name: "撒馬利亞", type: "property", price: 200, rent: 90, color: "bg-orange-500", text: "white", img: "https://images.unsplash.com/photo-1528114039593-4366cc08227d?q=80&w=400" },
                { name: "聖殿燈台", type: "utility", price: 150, rent: 60, color: "bg-yellow-400", img: "https://images.unsplash.com/photo-1519750157634-b6d493a0f77c?q=80&w=400" },
                { name: "拿撒勒", type: "property", price: 220, rent: 100, color: "bg-red-500", text: "white", img: "https://images.unsplash.com/photo-1531265726475-52ad60219627?q=80&w=400" },
                { name: "前往磨練", type: "go_to_jail", color: "bg-red-900", text: "white", img: "https://images.unsplash.com/photo-1509316785289-025f5d846b35?q=80&w=400" },
                { name: "伯利恆", type: "property", price: 240, rent: 110, color: "bg-red-500", text: "white", img: "https://images.unsplash.com/photo-1514214246283-d427a95c5d2f?q=80&w=400" },
                { name: "試煉卡", type: "chance", color: "bg-orange-100", img: "https://images.unsplash.com/photo-1446329813274-7c9036bd9a1f?q=80&w=400" },
                { name: "耶路撒冷", type: "property", price: 300, rent: 150, color: "bg-indigo-600", text: "white", img: "https://images.unsplash.com/photo-1548432571-08198547f37f?q=80&w=400" },
                { name: "聖殿稅", type: "tax", price: 200, color: "bg-gray-200", img: "https://images.unsplash.com/photo-1565114631702-f944a924f336?q=80&w=400" },
                { name: "新耶路撒冷", type: "property", price: 400, rent: 250, color: "bg-indigo-900", text: "white", img: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=400" },
            ];

            const playerColors = [{ name: "紅色", bg: "bg-red-500" }, { name: "藍色", bg: "bg-blue-500" }, { name: "綠色", bg: "bg-green-600" }, { name: "紫色", bg: "bg-purple-600" }];

            const getGridStyle = (index) => {
                let row, col;
                if (index >= 0 && index <= 6) { row = 6; col = 6 - index; }
                else if (index >= 7 && index <= 11) { row = 12 - index; col = 0; }
                else if (index >= 12 && index <= 18) { row = 0; col = index - 12; }
                else { row = index - 18; col = 6; }
                return { gridRow: row + 1, gridColumn: col + 1 };
            };

            const startGame = () => {
                const initialPlayers = Array.from({ length: playerCount }, (_, i) => ({
                    id: i, name: `玩家 ${i + 1}`, color: playerColors[i],
                    position: 0, money: 1500, inventory: [], isBankrupt: false
                }));
                setPlayers(initialPlayers); setCurrentPlayerIndex(0); setGameState('playing');
            };

            const addLog = (msg) => setGameLog(prev => [msg, ...prev].slice(0, 5));

            const rollDice = () => {
                if (rolling || players[currentPlayerIndex].isBankrupt) return;
                setRolling(true); setHasAttemptedPurchase(false);
                let rollInterval = setInterval(() => setDiceResult(Math.floor(Math.random() * 6) + 1), 80);
                setTimeout(() => {
                    clearInterval(rollInterval);
                    const roll = Math.floor(Math.random() * 6) + 1;
                    setDiceResult(roll); movePlayer(roll); setRolling(false);
                }, 800);
            };

            const movePlayer = (steps) => {
                setPlayers(prev => {
                    const n = [...prev]; const p = n[currentPlayerIndex];
                    let newPos = p.position + steps;
                    if (newPos >= boardTiles.length) { newPos %= boardTiles.length; p.money += 200; addLog(`${p.name} 領受 200 恩典。`); }
                    p.position = newPos; handleTileEffect(p, n); return n;
                });
            };

            const handleTileEffect = (player, all) => {
                const tile = boardTiles[player.position];
                if (tile.type === "tax") { player.money -= tile.price; addLog(`${player.name} 支付了 ${tile.price}。`); }
                else if (tile.type === "chance") {
                    const win = Math.random() > 0.5;
                    if (win) { player.money += 100; addLog(`${player.name} 獲得祝福！`); }
                    else { player.money -= 100; addLog(`${player.name} 遭遇試煉。`); }
                } else if (tile.type === "go_to_jail") { player.position = 6; addLog(`${player.name} 送往曠野磨練！`); }
                else if (tile.type === "property" || tile.type === "utility") {
                    const owner = all.find(o => o.inventory.includes(player.position));
                    if (owner && owner.id !== player.id) {
                        player.money -= tile.rent; owner.money += tile.rent;
                        addLog(`${player.name} 支付租金給 ${owner.name}。`);
                    }
                }
                if (player.money < 0) { player.isBankrupt = true; addLog(`${player.name} 破產了。`); }
            };

            useEffect(() => {
                if (showQuestion && timeLeft > 0 && !answered) {
                    timerRef.current = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
                } else if (timeLeft === 0 && !answered) { handleAnswer(-1); }
                return () => clearTimeout(timerRef.current);
            }, [showQuestion, timeLeft, answered]);

            const startQuestion = () => {
                setCurrentQuestion(BIBLE_QUESTIONS[Math.floor(Math.random() * BIBLE_QUESTIONS.length)]);
                setTimeLeft(10); setAnswered(false); setShowQuestion(true); setHasAttemptedPurchase(true);
            };

            const handleAnswer = (idx) => {
                if (answered) return; setAnswered(true); clearTimeout(timerRef.current);
                const correct = idx === currentQuestion.c;
                if (correct) { 
                    setPlayers(prev => {
                        const n = [...prev]; const p = n[currentPlayerIndex];
                        p.money -= boardTiles[p.position].price;
                        p.inventory.push(p.position); return n;
                    });
                    addLog(`${players[currentPlayerIndex].name} 答對，獲得產權！`); 
                } else { addLog(`${players[currentPlayerIndex].name} 回答失敗。`); }
                setTimeout(() => setShowQuestion(false), 1500);
            };

            const nextTurn = () => {
                let next = (currentPlayerIndex + 1) % players.length;
                while (players[next].isBankrupt) next = (next + 1) % players.length;
                setCurrentPlayerIndex(next); setDiceResult(0); setHasAttemptedPurchase(false);
            };

            const DiceFace = ({ value }) => {
                const dots = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
                return (
                    <div className="w-16 h-16 bg-white rounded-xl shadow-lg border-2 grid grid-cols-3 grid-rows-3 p-2 gap-1">
                        {[...Array(9)].map((_, i) => dots[value]?.includes(i) ? <div key={i} className="w-3 h-3 bg-stone-800 rounded-full" /> : <div key={i} />)}
                    </div>
                );
            };

            if (gameState === 'setup') return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-md w-full text-center border">
                        <Icons.BookOpen className="mx-auto text-amber-600 mb-6 w-16 h-16" />
                        <h1 className="text-4xl font-black mb-2">聖經大富翁</h1>
                        <p className="text-stone-500 mb-10 text-sm italic">信心與管家的應許之旅</p>
                        <div className="flex justify-center gap-4 mb-10">
                            {[2, 3, 4].map(n => <button key={n} onClick={() => setPlayerCount(n)} className={`w-14 h-14 rounded-2xl font-bold transition-all ${playerCount === n ? 'bg-amber-600 text-white scale-110 shadow-lg' : 'bg-stone-100 text-stone-500'}`}>{n}</button>)}
                        </div>
                        <button onClick={startGame} className="w-full py-4 bg-stone-900 text-white rounded-2xl font-bold flex items-center justify-center gap-2">開始旅程 <Icons.ChevronRight /></button>
                        {deferredPrompt && <button onClick={() => deferredPrompt.prompt()} className="mt-6 text-amber-700 text-xs font-bold bg-amber-50 px-4 py-2 rounded-full border border-amber-200 mx-auto">安裝 App</button>}
                    </div>
                </div>
            );

            const curr = players[currentPlayerIndex];

            return (
                <div className="min-h-screen p-4 flex flex-col items-center justify-center overflow-hidden">
                    <div className="w-full max-w-5xl flex justify-between items-center mb-4 bg-white/70 backdrop-blur-md p-3 rounded-2xl border shadow-sm z-50">
                        <div className="flex gap-4">
                            {players.map((p, i) => (
                                <div key={i} className={`flex items-center gap-2 px-3 py-1.5 rounded-xl border-2 ${p.isBankrupt ? 'opacity-30' : i === currentPlayerIndex ? 'border-amber-500 bg-amber-50' : 'border-transparent'}`}>
                                    <div className={`w-3 h-3 rounded-full ${p.color.bg}`} />
                                    <div><span className="text-[10px] font-bold block">{p.name}</span><span className="text-xs font-mono text-stone-600">${p.money}</span></div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="relative bg-stone-800 p-2 rounded-xl shadow-2xl border-4">
                        <div className="grid grid-cols-7 grid-rows-7 gap-1 bg-stone-300 w-[92vw] h-[92vw] max-w-[700px] max-h-[700px]">
                            {boardTiles.map((tile, i) => (
                                <div key={i} style={{...getGridStyle(i), backgroundImage: `url(${tile.img})`, backgroundSize: 'cover', backgroundPosition: 'center'}} className={`relative border border-stone-400 flex flex-col items-center justify-between p-1.5 overflow-hidden group`}>
                                    <div className="absolute inset-0 bg-black/40 z-0"></div>
                                    <div className={`absolute top-0 left-0 w-full h-1 ${tile.color} z-10`}></div>
                                    <span className="text-[8px] sm:text-[10px] font-bold text-center uppercase mt-1 z-10 text-white drop-shadow-md">{tile.name}</span>
                                    <div className="flex flex-wrap justify-center gap-1 my-1 min-h-[20px] z-20">
                                        {players.map(p => !p.isBankrupt && p.position === i && <div key={p.id} className={`w-4 h-4 sm:w-6 sm:h-6 rounded-full ${p.color.bg} border-2 border-white shadow-md animate-bounce`} />)}
                                    </div>
                                    <div className="w-full flex flex-col items-center z-10">
                                        {tile.price && <span className="text-[7px] sm:text-[9px] font-bold text-white bg-black/30 px-1 rounded-sm">${tile.price}</span>}
                                        {players.find(p => p.inventory.includes(i)) && <div className={`h-1.5 sm:h-2 w-full ${players.find(p => p.inventory.includes(i)).color.bg} mt-1`} />}
                                    </div>
                                </div>
                            ))}

                            <div className="col-start-2 col-end-7 row-start-2 row-end-7 bg-white m-1 rounded-lg flex flex-col shadow-inner border overflow-hidden z-40 relative">
                                {showQuestion ? (
                                    <div className="absolute inset-0 bg-white z-50 flex flex-col p-6">
                                        <div className="flex justify-between items-center mb-4"><div className="flex items-center gap-2 text-amber-600 font-black text-xs"><Icons.Clock /> 倒數: {timeLeft}s</div></div>
                                        <div className="w-full h-2 bg-stone-100 rounded-full mb-6 overflow-hidden"><div className={`h-full transition-all duration-1000 ${timeLeft < 4 ? 'bg-red-500' : 'bg-amber-500'}`} style={{ width: `${(timeLeft / 10) * 100}%` }}></div></div>
                                        <div className="flex-1 flex flex-col justify-center">
                                            <h3 className="text-xl font-bold text-stone-800 mb-8 leading-tight">{currentQuestion.q}</h3>
                                            <div className="space-y-3">
                                                {currentQuestion.a.map((ans, idx) => <button key={idx} onClick={() => handleAnswer(idx)} disabled={answered} className={`w-full p-4 rounded-2xl border-2 font-bold text-left ${answered ? (idx === currentQuestion.c ? 'bg-emerald-50 border-emerald-500 text-emerald-700' : 'bg-stone-50 border-stone-100 text-stone-300') : 'border-stone-100 hover:bg-amber-50 hover:border-amber-400'}`}>{ans}</button>)}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex-1 flex flex-col items-center justify-center p-4">
                                            <Icons.BookOpen className="text-amber-200 mb-2 w-10 h-10" />
                                            <h2 className="text-xl font-black text-stone-300 italic">BIBLE WORLD</h2>
                                            {diceResult > 0 && <div className="mt-4"><DiceFace value={diceResult} /></div>}
                                        </div>
                                        <div className="flex-1 flex flex-col justify-center gap-4 p-4">
                                            <div className="text-center">
                                                <p className="text-[10px] text-stone-400 font-bold uppercase mb-1">{curr.name} 的回合</p>
                                                <p className="text-stone-800 font-bold text-sm h-10 flex items-center justify-center">{gameLog[0]}</p>
                                            </div>
                                            <div className="flex justify-center gap-3">
                                                {diceResult === 0 ? <button onClick={rollDice} disabled={rolling} className="bg-stone-900 text-white px-8 py-3 rounded-xl font-bold shadow-md">擲骰子</button> : (
                                                    <div className="flex gap-2">
                                                        {(boardTiles[curr.position].type === 'property') && !players.some(o => o.inventory.includes(curr.position)) && !hasAttemptedPurchase && <button onClick={startQuestion} className="bg-amber-600 text-white px-6 py-3 rounded-xl font-bold shadow-md">回答題目</button>}
                                                        <button onClick={nextTurn} className="bg-stone-100 text-stone-800 px-6 py-3 rounded-xl font-bold">下一個</button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
